services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-histodle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-histodle}
      POSTGRES_DB: ${DB_NAME:-histodle}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      db:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER:-histodle}:${DB_PASSWORD:-histodle}@db:5432/${DB_NAME:-histodle}?sslmode=disable"
      - "up"
    volumes:
      - ./histodle-api/migrations:/migrations:ro

  api:
    build:
      context: ./histodle-api
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-histodle}
      DB_PASSWORD: ${DB_PASSWORD:-histodle}
      DB_NAME: ${DB_NAME:-histodle}
      DB_SSLMODE: disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./histodle-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
